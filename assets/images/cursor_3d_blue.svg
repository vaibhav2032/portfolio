<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Theme Glow -->
    <filter id="blueCursorGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0047FF" flood-opacity="0.38" />
    </filter>

    <!-- Top illuminated face: electric sky blue gradient -->
    <linearGradient id="cursorTopGrad" x1="16" y1="14" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Left side 3D extrusion wall: deep theme blue -->
    <linearGradient id="cursorLeftWall" x1="11" y1="18" x2="22" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0047FF" />
    </linearGradient>

    <!-- Notch 3D extrusion wall: vibrant royal blue -->
    <linearGradient id="cursorNotchWall" x1="30" y1="32" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0038CC" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <g filter="url(#blueCursorGlow)">
    <!-- Left extrusion 3D wall -->
    <polygon points="13,16 9,24 17,50 21,42" fill="url(#cursorLeftWall)" />

    <!-- Notch extrusion 3D wall -->
    <polygon points="32,34 28,42 42,48 46,40" fill="url(#cursorNotchWall)" />

    <!-- Bottom connection facet -->
    <polygon points="21,42 17,50 28,42 32,34" fill="#0031B8" />

    <!-- Top illuminated isometric face -->
    <polygon points="13,16 52,24 32,34 21,42" fill="url(#cursorTopGrad)" stroke="#BFDBFE" stroke-width="0.8" stroke-linejoin="round" />
  </g>
</svg>