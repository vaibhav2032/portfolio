<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drawer-shadow" x="-30%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-10" dy="0" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="#F8FAFC"/>

  <!-- BACKDROP: Background Enterprise PO Creation Workspace (60% width) -->
  <g opacity="0.45">
    <!-- App Navigation Header -->
    <rect x="0" y="0" width="800" height="42" fill="url(#header-grad)"/>
    <text x="24" y="26" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      SUPPLYMINT <tspan fill="#94A3B8" font-size="10" font-weight="500">/ PO Management</tspan>
    </text>

    <!-- PO Title & Info Header -->
    <g transform="translate(24, 58)">
      <text x="0" y="18" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
        Purchase Order #PO-2026-88194
      </text>
      <text x="0" y="34" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B">
        Destination: Distribution Center North • Seasonal Spring Apparel
      </text>
      <rect x="290" y="6" width="68" height="20" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
      <text x="324" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#B45309">
        DRAFTING
      </text>
    </g>

    <!-- PO Creation Table -->
    <g transform="translate(24, 108)">
      <!-- Table Header -->
      <rect x="0" y="0" width="460" height="30" rx="6" fill="#E2E8F0"/>
      <text x="14" y="19" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">SKU CODE</text>
      <text x="90" y="19" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">ITEM DESCRIPTION</text>
      <text x="240" y="19" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">QTY</text>
      <text x="310" y="19" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">UNIT PRICE</text>
      <text x="390" y="19" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">TOTAL</text>

      <!-- Table Rows -->
      <!-- Row 1 -->
      <rect x="0" y="36" width="460" height="36" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="58" font-family="monospace" font-size="9.5" font-weight="600" fill="#0F172A">SKU-7701</text>
      <text x="90" y="58" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#334155">Premium Pima Cotton</text>
      <text x="240" y="58" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#0F172A">1,500 pcs</text>
      <text x="310" y="58" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">$14.50</text>
      <text x="390" y="58" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">$21,750</text>

      <!-- Row 2 -->
      <rect x="0" y="78" width="460" height="36" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="100" font-family="monospace" font-size="9.5" font-weight="600" fill="#0F172A">SKU-7702</text>
      <text x="90" y="100" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#334155">Silk Blended Twill</text>
      <text x="240" y="100" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#0F172A">800 yds</text>
      <text x="310" y="100" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">$22.00</text>
      <text x="390" y="100" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">$17,600</text>

      <!-- Row 3 -->
      <rect x="0" y="120" width="460" height="36" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="142" font-family="monospace" font-size="9.5" font-weight="600" fill="#0F172A">SKU-8910</text>
      <text x="90" y="142" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#334155">Reinforced Brass Snaps</text>
      <text x="240" y="142" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#0F172A">5,000 pk</text>
      <text x="310" y="142" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">$0.45</text>
      <text x="390" y="142" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">$2,250</text>
    </g>
  </g>

  <!-- Dark Translucent Scrim / Masking over PO table -->
  <rect x="0" y="0" width="490" height="450" fill="#0F172A" opacity="0.30"/>
  
  <!-- Backdrop Label -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0F172A" opacity="0.85"/>
    <text x="140" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1">
      PO Work Table Obscured by Overlay
    </text>
  </g>

  <!-- FOREGROUND: 480px Slide-out Drawer Panel on the Right -->
  <g transform="translate(480, 0)" filter="url(#drawer-shadow)">
    <!-- Drawer Container -->
    <rect x="0" y="0" width="320" height="450" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Dimension Width Indicator Bar -->
    <rect x="0" y="0" width="320" height="26" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <line x1="8" y1="13" x2="312" y2="13" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="12,10 6,13 12,16" fill="#D97706"/>
    <polygon points="308,10 314,13 308,16" fill="#D97706"/>
    <rect x="105" y="4" width="110" height="18" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="16.5" text-anchor="middle" font-family="Inter, monospace" font-size="9" font-weight="700" fill="#B45309">
      ← 480px DRAWER →
    </text>

    <!-- Drawer Header -->
    <g transform="translate(16, 36)">
      <text x="0" y="20" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
        Vendor Intel Drawer
      </text>
      <text x="0" y="34" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">
        Apex Global Logistics (VND-88219)
      </text>
      
      <!-- Close X button -->
      <circle cx="276" cy="18" r="11" fill="#F1F5F9"/>
      <path d="M 272 14 L 280 22 M 280 14 L 272 22" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <line x1="0" y1="84" x2="320" y2="84" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Squeezed Horizontal Tabs -->
    <g transform="translate(14, 94)">
      <rect x="0" y="0" width="292" height="28" rx="6" fill="#F1F5F9"/>
      <!-- Tab 1 Active -->
      <rect x="2" y="2" width="94" height="24" rx="5" fill="#FFFFFF" filter="url(#card-shadow)"/>
      <text x="49" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#2563EB">Overview</text>
      <!-- Tab 2 -->
      <text x="146" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#64748B">Open POs</text>
      <!-- Tab 3 -->
      <text x="242" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#64748B">Ledger</text>
    </g>

    <!-- Cramped Telemetry Cards inside Drawer -->
    <g transform="translate(14, 134)">
      <!-- Metric Box 1 -->
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="18" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">OTIF SCORE</text>
      <text x="10" y="38" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8">94.8%</text>
      <text x="10" y="51" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#10B981">● Target Met</text>

      <!-- Metric Box 2 -->
      <rect x="152" y="0" width="140" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="162" y="18" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">OUTSTANDING</text>
      <text x="162" y="38" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#B45309">$48.2k</text>
      <text x="162" y="51" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">3 Unpaid Invoices</text>
    </g>

    <!-- Squeezed Table with Choked Columns & Horizontal Scroll Indicator -->
    <g transform="translate(14, 208)">
      <div xmlns="http://www.w3.org/1999/xhtml"></div>
      <text x="0" y="12" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#334155">
        RECENT TRANSACTION LEDGER
      </text>

      <!-- Table Box -->
      <rect x="0" y="20" width="292" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="20" width="292" height="24" rx="8" fill="#F8FAFC"/>
      <line x1="0" y1="44" x2="292" y2="44" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Table Header -->
      <text x="8" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#64748B">INV #</text>
      <text x="62" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#64748B">DATE</text>
      <text x="122" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#64748B">AMOUNT</text>
      <text x="195" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#64748B">STATUS [CUT OFF →]</text>

      <!-- Row 1 -->
      <text x="8" y="62" font-family="monospace" font-size="8" font-weight="600" fill="#0F172A">INV-981</text>
      <text x="62" y="62" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">12/04/26</text>
      <text x="122" y="62" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#0F172A">$12,400</text>
      <rect x="195" y="52" width="60" height="15" rx="3" fill="#ECFDF5"/>
      <text x="200" y="63" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#047857">CLEARED</text>

      <!-- Row 2 -->
      <line x1="0" y1="74" x2="292" y2="74" stroke="#F1F5F9" stroke-width="1"/>
      <text x="8" y="92" font-family="monospace" font-size="8" font-weight="600" fill="#0F172A">INV-994</text>
      <text x="62" y="92" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">18/04/26</text>
      <text x="122" y="92" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#0F172A">$35,800</text>
      <rect x="195" y="82" width="60" height="15" rx="3" fill="#FEF3C7"/>
      <text x="200" y="93" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#B45309">PENDING</text>

      <!-- Row 3 -->
      <line x1="0" y1="104" x2="292" y2="104" stroke="#F1F5F9" stroke-width="1"/>
      <text x="8" y="122" font-family="monospace" font-size="8" font-weight="600" fill="#0F172A">INV-102</text>
      <text x="62" y="122" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">24/04/26</text>
      <text x="122" y="122" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#0F172A">$9,150</text>
      <rect x="195" y="112" width="60" height="15" rx="3" fill="#FEF3C7"/>
      <text x="200" y="123" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#B45309">PENDING</text>

      <!-- Horizontal Scroll Bar Indicator at bottom of table -->
      <rect x="8" y="138" width="276" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="8" y="138" width="110" height="5" rx="2.5" fill="#94A3B8"/>
    </g>

    <!-- Flaw Badge at Bottom of Drawer -->
    <g transform="translate(14, 388)">
      <rect x="0" y="0" width="292" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#F59E0B"/>
      <text x="16" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">!</text>
      <text x="30" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#92400E">
        CHOKED HORIZONTAL DENSITY
      </text>
      <text x="30" y="32" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#B45309">
        Forces continuous horizontal scrolling for 8+ ledger columns
      </text>
    </g>
  </g>
</svg>
