<svg width="100%" height="100%" viewBox="0 0 340 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Serene Twilight Blue-Teal to Deep Slate -->
    <linearGradient id="bg_sanctuary_3" x1="170" y1="0" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="60%" stop-color="#0F2238"/>
      <stop offset="100%" stop-color="#14283F"/>
    </linearGradient>

    <!-- Warm Amber Radiant Glow from Pendant Light -->
    <radialGradient id="warm_amber_glow" cx="135" cy="62" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Teal Window Daylight / Moonlight Horizon -->
    <linearGradient id="window_twilight" x1="260" y1="42" x2="260" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Structural Cut Slab Poche Pattern -->
    <pattern id="poche_hatch_3" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas Fill -->
  <rect width="340" height="190" fill="url(#bg_sanctuary_3)"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="50" x2="340" y2="50" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="0" y1="100" x2="340" y2="100" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="100" y1="26" x2="100" y2="152" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="220" y1="26" x2="220" y2="152" stroke="#94A3B8" stroke-dasharray="3 3"/>
  </g>

  <!-- Panoramic Picture Window Aperture (Opening to serene twilight & nature) -->
  <g id="window_aperture">
    <!-- Window Opening Glass Pane -->
    <rect x="220" y="42" width="85" height="78" rx="2" fill="url(#window_twilight)"/>
    <!-- Distant Mountain/Horizon Silhouettes -->
    <path d="M 220 102 Q 245 92 265 98 T 305 94 L 305 120 L 220 120 Z" fill="#0C2036" opacity="0.7"/>
    <path d="M 220 110 Q 250 104 275 109 T 305 106 L 305 120 L 220 120 Z" fill="#08182B" opacity="0.9"/>
    <!-- Organic Botanical Branch Silhouette Outside the Glass -->
    <path d="M 285 120 Q 282 95 268 76 Q 262 68 250 64" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" opacity="0.4" fill="none"/>
    <path d="M 272 82 Q 278 78 285 80" stroke="#10B981" stroke-width="0.8" opacity="0.4" fill="none"/>
    <circle cx="286" cy="80" r="2" fill="#10B981" opacity="0.3"/>
    <circle cx="250" cy="64" r="2.5" fill="#34D399" opacity="0.35"/>
    <circle cx="262" cy="72" r="2" fill="#10B981" opacity="0.3"/>
    <!-- Architectural Window Frame & Mullions -->
    <rect x="220" y="42" width="85" height="78" rx="2" stroke="#475569" stroke-width="1.5" fill="none"/>
    <line x1="262" y1="42" x2="262" y2="120" stroke="#334155" stroke-width="1"/>
    <line x1="220" y1="82" x2="305" y2="82" stroke="#334155" stroke-width="0.8"/>
  </g>

  <!-- Warm Amber Ambient Radial Glow radiating across desk & floor -->
  <circle cx="135" cy="62" r="95" fill="url(#warm_amber_glow)"/>

  <!-- Top Cut Roof Slab (Poche) -->
  <rect x="0" y="14" width="340" height="12" fill="#0F172A"/>
  <rect x="0" y="14" width="340" height="12" fill="url(#poche_hatch_3)" opacity="0.4"/>
  <line x1="0" y1="26" x2="340" y2="26" stroke="#475569" stroke-width="1.2"/>
  <line x1="0" y1="14" x2="340" y2="14" stroke="#334155" stroke-width="0.8"/>

  <!-- Ceiling Acoustic Wood Slats / Baffles -->
  <g stroke="#64748B" stroke-width="0.8" opacity="0.5">
    <line x1="45" y1="26" x2="45" y2="31"/>
    <line x1="65" y1="26" x2="65" y2="31"/>
    <line x1="85" y1="26" x2="85" y2="31"/>
    <line x1="105" y1="26" x2="105" y2="31"/>
    <line x1="125" y1="26" x2="125" y2="31"/>
    <line x1="145" y1="26" x2="145" y2="31"/>
    <line x1="165" y1="26" x2="165" y2="31"/>
    <line x1="185" y1="26" x2="185" y2="31"/>
    <line x1="205" y1="26" x2="205" y2="31"/>
  </g>

  <!-- Bottom Cut Floor Slab (Poche) -->
  <rect x="0" y="152" width="340" height="38" fill="#0F172A"/>
  <rect x="0" y="152" width="340" height="38" fill="url(#poche_hatch_3)" opacity="0.4"/>
  <line x1="0" y1="152" x2="340" y2="152" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="0" y1="189" x2="340" y2="189" stroke="#334155" stroke-width="0.8"/>

  <!-- Left Wall Cut Poche -->
  <rect x="0" y="26" width="32" height="126" fill="#0F172A"/>
  <rect x="0" y="26" width="32" height="126" fill="url(#poche_hatch_3)" opacity="0.4"/>
  <line x1="32" y1="26" x2="32" y2="152" stroke="#475569" stroke-width="1.2"/>

  <!-- Right Wall Cut Poche -->
  <rect x="312" y="26" width="28" height="126" fill="#0F172A"/>
  <rect x="312" y="26" width="28" height="126" fill="url(#poche_hatch_3)" opacity="0.4"/>
  <line x1="312" y1="26" x2="312" y2="152" stroke="#475569" stroke-width="1.2"/>

  <!-- Curated Floating Bookshelf on Left Wall -->
  <g id="bookshelf">
    <rect x="32" y="70" width="36" height="3" fill="#D97706" opacity="0.8"/>
    <!-- Neatly stacked books with subtle colors -->
    <rect x="36" y="58" width="4" height="12" fill="#38BDF8"/>
    <rect x="41" y="60" width="5" height="10" fill="#F59E0B"/>
    <rect x="47" y="56" width="4" height="14" fill="#10B981"/>
    <rect x="52" y="62" width="6" height="8" fill="#E2E8F0"/>
    <!-- Second lower shelf -->
    <rect x="32" y="96" width="36" height="3" fill="#D97706" opacity="0.8"/>
    <rect x="36" y="86" width="12" height="10" fill="#475569"/>
    <circle cx="58" cy="90" r="3" fill="#10B981" opacity="0.6"/>
  </g>

  <!-- Potted Fiddle Leaf / Olive Plant by Window -->
  <g id="potted_plant" transform="translate(225, 126)">
    <!-- Minimal Terracotta Pot -->
    <polygon points="4,26 18,26 16,14 6,14" fill="#D97706" opacity="0.8"/>
    <line x1="5" y1="14" x2="17" y2="14" stroke="#FBBF24" stroke-width="1"/>
    <!-- Organic Plant Stems & Leaves -->
    <path d="M 11 14 Q 10 4 6 -2" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 11 14 Q 14 6 18 0" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="5" cy="-2" rx="4" ry="2.5" fill="#34D399" opacity="0.8" transform="rotate(-30 5 -2)"/>
    <ellipse cx="18" cy="0" rx="3.5" ry="2" fill="#10B981" opacity="0.8" transform="rotate(25 18 0)"/>
    <ellipse cx="8" cy="5" rx="3" ry="1.8" fill="#059669" opacity="0.8" transform="rotate(-15 8 5)"/>
  </g>

  <!-- Ergonomic Scandinavian Desk -->
  <g id="desk">
    <!-- Desk Top Surface -->
    <rect x="86" y="118" width="76" height="5" rx="1.5" fill="#FBBF24" opacity="0.9"/>
    <line x1="86" y1="123" x2="162" y2="123" stroke="#D97706" stroke-width="0.8"/>
    <!-- Tapered Architectural Desk Legs -->
    <line x1="92" y1="123" x2="89" y2="152" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="156" y1="123" x2="159" y2="152" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Laptop / Display on desk -->
    <rect x="110" y="106" width="18" height="12" rx="1" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8"/>
    <line x1="108" y1="118" x2="130" y2="118" stroke="#94A3B8" stroke-width="1.2"/>
    <!-- Soft warm task reflection on laptop screen -->
    <rect x="112" y="108" width="14" height="8" rx="0.5" fill="#F59E0B" opacity="0.25"/>
    <!-- Coffee cup -->
    <rect x="136" y="113" width="4" height="5" rx="0.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- Desk chair hint -->
    <path d="M 80 130 L 80 152 M 74 130 L 86 130 M 76 115 L 76 130" stroke="#334155" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Elegant Pendant Lamp Fixture Hanging from Ceiling -->
  <line x1="135" y1="26" x2="135" y2="56" stroke="#94A3B8" stroke-width="1"/>
  <!-- Bell / Dome shade -->
  <path d="M 127 60 Q 135 54 143 60 L 145 63 L 125 63 Z" fill="#FBBF24"/>
  <!-- Glowing bulb -->
  <circle cx="135" cy="64" r="3" fill="#FFFFFF"/>
  <circle cx="135" cy="64" r="7" fill="#F59E0B" opacity="0.4"/>

  <!-- Architectural Scale Figure (Standing relaxed, grounded, calm in sanctuary) -->
  <g transform="translate(176, 114)" id="scale_figure_sanctuary">
    <!-- Head in profile, gazing warmly towards desk/room -->
    <ellipse cx="6" cy="4" rx="3.4" ry="4" fill="#F8FAFC"/>
    <circle cx="6" cy="4" r="3.4" fill="#0F172A" opacity="0.85"/>
    <!-- Neck -->
    <line x1="6" y1="8" x2="6" y2="10" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Torso - relaxed, comfortable human posture -->
    <path d="M 3 10 L 9 10 L 10 25 L 2 25 Z" fill="#0F172A"/>
    <!-- Warm rim light on figure back/shoulder from pendant lamp -->
    <path d="M 3 10 L 2 25" stroke="#FBBF24" stroke-width="0.8" opacity="0.7"/>
    <!-- Left Arm (hand resting comfortably in pocket / relaxed side) -->
    <path d="M 3 12 L 0 18 L 1 24" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Right Arm (holding tablet or relaxed forward) -->
    <path d="M 9 12 L 12 17 L 11 22" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Balanced, grounded legs stance -->
    <path d="M 4 25 L 3 37" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 25 L 9 37" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Shoes firmly on floor -->
    <ellipse cx="2.5" cy="37.5" rx="2" ry="0.8" fill="#0F172A"/>
    <ellipse cx="9.5" cy="37.5" rx="2" ry="0.8" fill="#0F172A"/>
    <!-- Soft warm grounded shadow -->
    <ellipse cx="6" cy="38" rx="14" ry="1.8" fill="#059669" opacity="0.2"/>
  </g>

  <!-- Architectural Annotations & Callout Tags -->
  <g font-family="ui-monospace, monospace" font-size="8" fill="#10B981">
    <!-- Selected Pattern Callout -->
    <rect x="70" y="36" width="96" height="15" rx="3" fill="#0F172A" stroke="#10B981" stroke-width="0.8" opacity="0.95"/>
    <text x="75" y="46" fill="#34D399" font-size="6.8" font-weight="700">OPTIMAL SANCTUARY</text>

    <!-- Floor Datum Annotation -->
    <text x="36" y="164" fill="#10B981" font-size="7.5" font-weight="600">±0.00m [IN-SITU]</text>

    <!-- Balanced Golden Ratio Dimension Tick -->
    <line x1="86" y1="146" x2="162" y2="146" stroke="#10B981" stroke-width="0.8"/>
    <polygon points="86,146 91,144 91,148" fill="#10B981"/>
    <polygon points="162,146 157,144 157,148" fill="#10B981"/>
    <text x="108" y="143" fill="#34D399" font-size="6.8" font-weight="600">w: 1140px</text>
  </g>
</svg>
