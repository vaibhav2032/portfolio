<svg width="100%" height="100%" viewBox="0 0 340 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Claustrophobic Corridor -->
    <linearGradient id="bg_corridor_2" x1="170" y1="0" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#182234"/>
    </linearGradient>

    <!-- Compressed Harsh Downlight Beam -->
    <linearGradient id="harsh_slit_light" x1="170" y1="26" x2="170" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#FBBF24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>

    <!-- Structural Poche Hatch Pattern -->
    <pattern id="poche_hatch_2" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas Fill -->
  <rect width="340" height="190" fill="url(#bg_corridor_2)"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g opacity="0.12">
    <line x1="0" y1="50" x2="340" y2="50" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="0" y1="100" x2="340" y2="100" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="170" y1="26" x2="170" y2="152" stroke="#94A3B8" stroke-dasharray="3 3"/>
  </g>

  <!-- Harsh Vertical Shaft Light -->
  <polygon points="158,26 182,26 198,152 142,152" fill="url(#harsh_slit_light)"/>

  <!-- Top Cut Roof Slab (Poche) -->
  <rect x="0" y="14" width="340" height="12" fill="#0F172A"/>
  <rect x="0" y="14" width="340" height="12" fill="url(#poche_hatch_2)" opacity="0.4"/>
  <line x1="0" y1="26" x2="340" y2="26" stroke="#475569" stroke-width="1.2"/>
  <line x1="0" y1="14" x2="340" y2="14" stroke="#334155" stroke-width="0.8"/>

  <!-- Bottom Cut Floor Slab (Poche) -->
  <rect x="0" y="152" width="340" height="38" fill="#0F172A"/>
  <rect x="0" y="152" width="340" height="38" fill="url(#poche_hatch_2)" opacity="0.4"/>
  <line x1="0" y1="152" x2="340" y2="152" stroke="#64748B" stroke-width="1.5"/>
  <line x1="0" y1="189" x2="340" y2="189" stroke="#334155" stroke-width="0.8"/>

  <!-- MASSIVE Left Wall Cut Poche (Encroaching into usable room) -->
  <rect x="0" y="26" width="122" height="126" fill="#0F172A"/>
  <rect x="0" y="26" width="122" height="126" fill="url(#poche_hatch_2)" opacity="0.4"/>
  <line x1="122" y1="26" x2="122" y2="152" stroke="#475569" stroke-width="1.6"/>

  <!-- MASSIVE Right Wall Cut Poche (Encroaching into usable room) -->
  <rect x="218" y="26" width="122" height="126" fill="#0F172A"/>
  <rect x="218" y="26" width="122" height="126" fill="url(#poche_hatch_2)" opacity="0.4"/>
  <line x1="218" y1="26" x2="218" y2="152" stroke="#475569" stroke-width="1.6"/>

  <!-- Cramped Protruding Vertical Ledges & Shelving in the Slit -->
  <!-- Left Ledge -->
  <rect x="122" y="65" width="22" height="4" fill="#334155"/>
  <line x1="122" y1="69" x2="144" y2="80" stroke="#475569" stroke-width="1"/>
  <!-- Right Ledge -->
  <rect x="198" y="88" width="20" height="4" fill="#334155"/>
  <line x1="218" y1="92" x2="198" y2="102" stroke="#475569" stroke-width="1"/>

  <!-- Hanging Downlight Fixture in the narrow ceiling slit -->
  <line x1="170" y1="26" x2="170" y2="38" stroke="#64748B" stroke-width="1"/>
  <circle cx="170" cy="40" r="3" fill="#F59E0B"/>
  <circle cx="170" cy="40" r="8" fill="#F59E0B" opacity="0.2"/>

  <!-- Architectural Scale Figure (Trapped & Constrained inside the narrow corridor) -->
  <g transform="translate(162, 114)" id="scale_figure_corridor">
    <!-- Head tilted slightly, looking at tight boundary -->
    <ellipse cx="6" cy="4" rx="3.2" ry="3.8" fill="#F8FAFC"/>
    <circle cx="6" cy="4" r="3.2" fill="#0F172A" opacity="0.85"/>
    <!-- Neck -->
    <line x1="6" y1="7.8" x2="6" y2="10" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Torso - upright, compressed posture -->
    <path d="M 4 10 L 8 10 L 9 25 L 3 25 Z" fill="#0F172A"/>
    <!-- Left Arm raised/pressed near the encroaching wall -->
    <path d="M 4 12 L 0 17 L -4 20" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -4 20 L -6 20" stroke="#F59E0B" stroke-width="0.8" opacity="0.6"/>
    <!-- Right Arm pressed against side -->
    <path d="M 8 12 L 10 18 L 10 24" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Legs in narrow, hesitant standing stance -->
    <path d="M 4 25 L 3 37" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 8 25 L 9 37" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Feet on floor line -->
    <ellipse cx="2.5" cy="37.5" rx="1.8" ry="0.8" fill="#0F172A"/>
    <ellipse cx="9.5" cy="37.5" rx="1.8" ry="0.8" fill="#0F172A"/>
    <!-- Compressed Floor Shadow -->
    <ellipse cx="6" cy="38" rx="8" ry="1.2" fill="#D97706" opacity="0.2"/>
  </g>

  <!-- Architectural Dimensioning for the Narrow Slit (480px / 1.20m) -->
  <g font-family="ui-monospace, monospace" font-size="8" fill="#F59E0B">
    <!-- Horizontal Dimension Witness Lines & Arrow -->
    <line x1="122" y1="138" x2="122" y2="148" stroke="#F59E0B" stroke-width="0.8"/>
    <line x1="218" y1="138" x2="218" y2="148" stroke="#F59E0B" stroke-width="0.8"/>
    <line x1="122" y1="143" x2="218" y2="143" stroke="#F59E0B" stroke-width="0.8"/>
    <!-- Dimension Arrowheads -->
    <polygon points="122,143 128,141 128,145" fill="#F59E0B"/>
    <polygon points="218,143 212,141 212,145" fill="#F59E0B"/>
    <rect x="145" y="136" width="50" height="13" rx="2" fill="#0F172A" stroke="#F59E0B" stroke-width="0.6"/>
    <text x="148" y="145" fill="#FBBF24" font-size="7" font-weight="700">w: 1.20m</text>

    <!-- Compression Callout -->
    <rect x="135" y="44" width="70" height="15" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="0.7" opacity="0.95"/>
    <text x="140" y="54" fill="#FBBF24" font-size="6.8" font-weight="700">CHOKED WIDTH</text>

    <!-- Level Marks -->
    <text x="225" y="164" fill="#64748B" font-size="7.5" font-weight="600">±0.00m</text>
  </g>
</svg>
