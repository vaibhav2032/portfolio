<svg class="w-10 h-10 sm:w-11 sm:h-11 shrink-0 transition-transform duration-300 group-hover:translate-x-1.5" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g filter="url(#filter_theme_dart)">
    <!-- 1. Needle Point (Hardened Steel) -->
    <polygon points="61,32 47,28 47,32" fill="#F1F5F9" />
    <polygon points="61,32 47,32 47,36" fill="#94A3B8" />

    <!-- 2. Front Nose Collar -->
    <polygon points="47,28 41,25.5 41,32 47,32" fill="#93C5FD" />
    <polygon points="47,32 41,32 41,38.5 47,36" fill="#2563EB" />

    <!-- 3. Barrel Body (Knurled 3D Isometric Cylinder) -->
    <!-- Top Highlight Facet -->
    <polygon points="41,25.5 24,25.5 24,32 41,32" fill="#60A5FA" />
    <!-- Bottom Shadow Facet -->
    <polygon points="41,32 24,32 24,38.5 41,38.5" fill="#0047FF" />

    <!-- 3D Knurled Metallic Grip Rings -->
    <polygon points="39,24.5 36,24.5 36,39.5 39,39.5" fill="#1E40AF" />
    <polygon points="34,24.5 31,24.5 31,39.5 34,39.5" fill="#1E40AF" />
    <polygon points="29,24.5 26,24.5 26,39.5 29,39.5" fill="#1E40AF" />

    <!-- 4. Slim Shaft / Stem -->
    <polygon points="24,29.5 16,29.5 16,32 24,32" fill="#BFDBFE" />
    <polygon points="24,32 16,32 16,34.5 24,34.5" fill="#1D4ED8" />

    <!-- 5. 3D Dart Flight Wings (4 Aerodynamic Fins) -->
    <!-- Top Vertical Fin -->
    <polygon points="16,30 3,13 1,20 12,31" fill="#EFF6FF" />
    <polygon points="16,30 3,13 5,12 16,29" fill="#DBEAFE" />

    <!-- Bottom Vertical Fin -->
    <polygon points="16,34 3,51 1,44 12,33" fill="#0047FF" />
    <polygon points="16,34 3,51 5,52 16,35" fill="#1E3A8A" />

    <!-- Lateral Fin (Front Facing) -->
    <polygon points="16,32 4,25 3,39 14,33.5" fill="#2563EB" />

    <!-- Lateral Fin (Rear Facing) -->
    <polygon points="16,31 7,23 5,27 14,31.5" fill="#3B82F6" />

    <!-- Flight Cap / End Pin -->
    <polygon points="4,25 0.5,32 4,39 6,32" fill="#0038CC" />
  </g>
  <defs>
    <filter id="filter_theme_dart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0047FF" flood-opacity="0.45"/>
    </filter>
  </defs>
</svg>