<svg width="100%" height="100%" viewBox="0 0 340 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Architectural Very Light Grey Canvas -->
    <linearGradient id="bg_light_grey_clean" x1="170" y1="0" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="50%" stop-color="#F4F5F7"/>
      <stop offset="100%" stop-color="#ECEEF2"/>
    </linearGradient>

    <!-- Cold Stark Light Cone on Light Background -->
    <linearGradient id="cold_cone_light_clean" x1="175" y1="26" x2="175" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Exterior Door Moonlight Shaft on Light Background -->
    <linearGradient id="door_shaft_light_clean" x1="28" y1="70" x2="110" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Light Concrete Poche Hatch Pattern -->
    <pattern id="poche_hatch_subtle" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base Canvas Fill: Uniform Very Light Grey -->
  <rect width="340" height="190" fill="url(#bg_light_grey_clean)"/>

  <!-- Architectural Coordinate Grid / Blueprint Datum Lines -->
  <g opacity="0.35">
    <line x1="0" y1="50" x2="340" y2="50" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="0" y1="100" x2="340" y2="100" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="100" y1="26" x2="100" y2="152" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="200" y1="26" x2="200" y2="152" stroke="#CBD5E1" stroke-dasharray="3 3"/>
  </g>

  <!-- Cold Distant Door Light Beam Spilling Across Floor -->
  <polygon points="26,68 46,68 126,152 26,152" fill="url(#door_shaft_light_clean)"/>

  <!-- Stark Cold Overhead Downlight Cone -->
  <polygon points="168,26 182,26 220,152 130,152" fill="url(#cold_cone_light_clean)"/>

  <!-- Top Cut Roof Slab (Subtle Architectural Concrete Tone) -->
  <rect x="0" y="14" width="340" height="12" fill="#E2E8F0"/>
  <rect x="0" y="14" width="340" height="12" fill="url(#poche_hatch_subtle)" opacity="0.7"/>
  <line x1="0" y1="26" x2="340" y2="26" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="0" y1="14" x2="340" y2="14" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- Bottom Cut Floor Slab (Subtle Architectural Concrete Tone) -->
  <rect x="0" y="152" width="340" height="38" fill="#E2E8F0"/>
  <rect x="0" y="152" width="340" height="38" fill="url(#poche_hatch_subtle)" opacity="0.7"/>
  <line x1="0" y1="152" x2="340" y2="152" stroke="#64748B" stroke-width="1.5"/>
  <line x1="0" y1="189" x2="340" y2="189" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- Right Exterior Wall Poche (Subtle Cut Concrete Section) -->
  <rect x="296" y="26" width="44" height="126" fill="#E2E8F0"/>
  <rect x="296" y="26" width="44" height="126" fill="url(#poche_hatch_subtle)" opacity="0.7"/>
  <line x1="296" y1="26" x2="296" y2="152" stroke="#94A3B8" stroke-width="1.2"/>

  <!-- High Barren Wall Linework -->
  <line x1="26" y1="26" x2="26" y2="68" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="280" y1="26" x2="280" y2="152" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Detached Outpost Exit Door Frame -->
  <rect x="18" y="68" width="8" height="84" fill="#CBD5E1"/>
  <rect x="26" y="68" width="20" height="84" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.2" fill="#E0F2FE" fill-opacity="0.4"/>
  <line x1="46" y1="68" x2="46" y2="152" stroke="#64748B" stroke-width="1.4"/>
  <!-- Door swing arc / threshold -->
  <path d="M 26 152 A 20 20 0 0 1 46 152" stroke="#0284C7" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

  <!-- Empty Hanging Light Fixture -->
  <line x1="175" y1="26" x2="175" y2="34" stroke="#64748B" stroke-width="1.2"/>
  <rect x="168" y="34" width="14" height="3" rx="1" fill="#475569"/>

  <!-- Architectural Elevation Scale Human Silhouette (Walking away towards exit) -->
  <g transform="translate(68, 114)" id="scale_figure_outpost">
    <!-- Head tilted slightly down, facing left toward door -->
    <ellipse cx="6" cy="4" rx="3.2" ry="3.8" fill="#1E293B"/>
    <!-- Neck -->
    <line x1="6" y1="7.8" x2="6" y2="10" stroke="#1E293B" stroke-width="1.8"/>
    <!-- Torso / Coat in stride walking left -->
    <path d="M 3 10 L 9 10 L 11 25 L 1 24 Z" fill="#1E293B"/>
    <!-- Coat edge highlight -->
    <path d="M 2 11 L 1 24 L 3 24" stroke="#0284C7" stroke-width="0.8" fill="none" opacity="0.7"/>
    <!-- Left Leg (forward step) -->
    <path d="M 3 24 L -1 37 L -3 37.5" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Right Leg (trailing step) -->
    <path d="M 9 24 L 11 32 L 13 37" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Feet shoes at floor level -->
    <ellipse cx="-2.5" cy="37.5" rx="2" ry="0.8" fill="#1E293B"/>
    <ellipse cx="13" cy="37" rx="1.8" ry="0.8" fill="#1E293B"/>
    <!-- Left Arm leading step -->
    <path d="M 4 12 L 0 20 L -2 24" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Shadow on light grey floor -->
    <ellipse cx="5" cy="38" rx="14" ry="1.8" fill="#94A3B8" opacity="0.4"/>
  </g>

  <!-- Architectural Dimension & Callout Annotations -->
  <g font-family="ui-monospace, monospace" font-size="8" fill="#475569">
    <!-- Height Level Marker -->
    <line x1="302" y1="26" x2="330" y2="26" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="302" y="22" fill="#475569" font-size="7.5" font-weight="700">+4.80m [ISOLATED]</text>

    <!-- Floor Datum Marker -->
    <line x1="302" y1="152" x2="330" y2="152" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="302" y="164" fill="#475569" font-size="7.5" font-weight="700">±0.00m</text>

    <!-- Disconnected Access Callout -->
    <line x1="48" y1="78" x2="88" y2="58" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="2 2"/>
    <circle cx="48" cy="78" r="1.5" fill="#DC2626"/>
    <rect x="90" y="50" width="86" height="15" rx="3" fill="#FFFFFF" stroke="#EF4444" stroke-width="0.8" opacity="0.95"/>
    <text x="95" y="61" fill="#DC2626" font-size="7" font-weight="700">SEVERED CONTEXT</text>

    <!-- Direction Arrow (Walking Away) -->
    <path d="M 68 144 L 40 144 M 46 140 L 40 144 L 46 148" stroke="#DC2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
